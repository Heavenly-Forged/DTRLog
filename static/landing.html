<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTR System</title>
    <link rel="icon" type="image/png" href="/static/img/WebLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#fdf4eb] text-[#0f172a] antialiased min-h-screen flex flex-col font-inter">

    <nav class="w-full p-8 flex justify-between items-center max-w-7xl mx-auto">
        <div class="font-black text-3xl tracking-tighter">DTRLog<span class="text-blue-600">.</span></div>
        <a href="/login" class="bg-[#0f172a] hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
            Sign In
        </a>
    </nav>

    <main class="flex-grow flex items-center max-w-7xl mx-auto px-8 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
            
            <!-- Left Side: Bold Typography -->
            <div class="order-2 lg:order-1 text-center lg:text-left">
                <h2 class="text-2xl font-bold tracking-widest uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-2">
                    OJT Hours Tracker
                </h2>
                <h1 class="text-6xl md:text-8xl font-black tracking-tighter leading-none mb-8 text-[#0f172a] uppercase">
                    Automate <br>
                    <span class="text-[#1e293b]">Your DTR.</span>
                </h1>
                <p class="text-xl text-slate-600 mb-10 max-w-md mx-auto lg:mx-0 font-medium leading-relaxed">
                    Log your daily practicum shifts, track your training progress, and instantly generate official, supervisor-ready PDF timesheets with auto-calculated net hours.
                </p>
                <a href="/login" class="inline-block bg-[#0f172a] hover:bg-blue-600 text-white font-bold py-4 px-10 rounded-full text-lg transition-all shadow-xl hover:shadow-2xl transform hover:-translate-y-1">
                    Get Started
                </a>
            </div>

            <!-- Right Side: Graphic/Image -->
                <div class="order-1 lg:order-2 flex justify-center">
                    <div class="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border-8 border-white transform rotate-2 hover:rotate-0 transition-transform duration-500">
                        <img src="/static/img/Landing.jpg" alt="System Preview" class="w-full h-auto object-contain">
                    </div>
                </div>

        </div>
    </main>

</body>
</html>
