<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practicum DTR</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        
        .controls { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 30px; background: #f1f5f9; padding: 15px; border-radius: 8px; }
        @media (min-width: 600px) { .controls { grid-template-columns: repeat(4, 1fr); } }
        
        input, button { padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; width: 100%; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1d4ed8; }
        .btn-outline { background: white; color: var(--text); border: 1px solid var(--border); }
        .btn-danger { background: #dc2626; color: white; padding: 4px 8px; font-size: 12px; }

        .dtr-page { margin-bottom: 40px; padding: 20px; border: 1px solid var(--border); border-radius: 8px; }
        .company-header { text-align: center; margin-bottom: 20px; }
        .company-name { font-size: 20px; font-weight: bold; text-transform: uppercase; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 14px; }
        th, td { border: 1px solid var(--text); padding: 8px; text-align: center; }
        th { background-color: #f1f5f9; }
        
        .signatures { display: flex; justify-content: space-between; margin-top: 40px; flex-wrap: wrap; gap: 20px; }
        .sig-block { width: 45%; text-align: center; }
        .sig-line { border-top: 1px solid var(--text); margin-top: 30px; padding-top: 5px; font-weight: bold; }
        
        /* Print Rules - This makes multiple DTRs fit cleanly on one PDF */
        @media print {
            body { padding: 0; background: white; }
            .no-print { display: none !important; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .dtr-page { border: none; padding: 0; margin-bottom: 0; page-break-inside: avoid; page-break-after: always; }
            /* Remove empty page after last element */
            .dtr-page:last-child { page-break-after: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar no-print">
        <h3>DTR Manager</h3>
        <a href="/logout" class="btn-outline" style="padding: 8px 15px; text-decoration: none; border-radius: 4px;">Logout</a>
    </div>

    <!-- Data Entry Form -->
    <div class="controls no-print">
        <input type="date" id="dateInput">
        <input type="time" id="timeInInput">
        <input type="time" id="timeOutInput">
        <button onclick="addLog()">Clock Record</button>
    </div>
    
    <div class="no-print" style="margin-bottom: 20px; text-align: right;">
        <button onclick="window.print()" style="width: auto; padding: 10px 20px; background: #10b981;">🖨️ Print / Save PDF</button>
    </div>

    <!-- Generated Report Container -->
    <div id="report-container">
        <!-- JS will inject paginated DTR tables here -->
    </div>
</div>

<script>
    function calculateHours(timeIn, timeOut) {
        const [inH, inM] = timeIn.split(':');
        const [outH, outM] = timeOut.split(':');
        let dIn = new Date(2000, 0, 1, inH, inM);
        let dOut = new Date(2000, 0, 1, outH, outM);
        if (dOut < dIn) dOut.setDate(dOut.getDate() + 1);
        return ((dOut - dIn) / (1000 * 60 * 60)).toFixed(2);
    }

    async function fetchLogs() {
        const res = await fetch('/api/logs');
        if (res.status === 401) window.location.reload();
        const logs = await res.json();
        renderPaginatedReport(logs);
    }

    async function addLog() {
        const date = document.getElementById('dateInput').value;
        const timeIn = document.getElementById('timeInInput').value;
        const timeOut = document.getElementById('timeOutInput').value;
        if (!date || !timeIn || !timeOut) return alert('Fill all fields');
        
        await fetch('/api/logs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date, time_in: timeIn, time_out: timeOut, hours: parseFloat(calculateHours(timeIn, timeOut)) })
        });
        fetchLogs();
    }

    async function deleteLog(id) {
        if(confirm('Delete this record?')) {
            await fetch(`/api/logs/${id}`, { method: 'DELETE' });
            fetchLogs();
        }
    }

    function renderPaginatedReport(logs) {
        const container = document.getElementById('report-container');
        container.innerHTML = '';
        
        // Group logs into chunks (e.g., 7 days per DTR page to ensure it fits perfectly on A4/Letter)
        const CHUNK_SIZE = 7; 
        for (let i = 0; i < logs.length; i += CHUNK_SIZE) {
            const chunk = logs.slice(i, i + CHUNK_SIZE);
            let total = 0;
            let rows = chunk.map(log => {
                total += log.hours;
                return `<tr>
                    <td>${log.date}</td>
                    <td>${log.time_in}</td>
                    <td>${log.time_out}</td>
                    <td>${log.hours.toFixed(2)}</td>
                    <td class="no-print"><button class="btn-danger" onclick="deleteLog(${log.id})">X</button></td>
                </tr>`;
            }).join('');

            const page = document.createElement('div');
            page.className = 'dtr-page';
            page.innerHTML = `
                <div class="company-header">
                    <div class="company-name" contenteditable="true">Philippine Spark Security Infoplant Corp</div>
                    <div>Daily Time Record</div>
                </div>
                <table>
                    <thead>
                        <tr><th>Date</th><th>Time In</th><th>Time Out</th><th>Hours</th><th class="no-print">Act</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr><th colspan="3" style="text-align: right;">Total Hours:</th><th colspan="2">${total.toFixed(2)}</th></tr>
                    </tfoot>
                </table>
                <div class="signatures">
                    <div class="sig-block">
                        <div class="sig-line">Jiro Cordial Beringuela</div>
                        <div style="font-size: 14px;">IT Intern</div>
                    </div>
                    <div class="sig-block">
                        <div class="sig-line" contenteditable="true">Click to Edit Supervisor Name</div>
                        <div style="font-size: 14px;">IT Admin Supervisor</div>
                    </div>
                </div>
            `;
            container.appendChild(page);
        }
    }

    window.onload = fetchLogs;
</script>
</body>
</html>
