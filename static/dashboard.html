<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTR Dashboard</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configure Tailwind for Dark Mode -->
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased p-4 md:p-8 transition-colors duration-300">

<div class="max-w-6xl mx-auto print-container">
    <header class="flex justify-between items-center mb-8 no-print glass dark:bg-slate-800/90 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        <div class="flex items-center gap-4">
            <img id="userAvatar" class="w-12 h-12 rounded-full ring-2 ring-slate-100 dark:ring-slate-700 shadow-sm" src="" alt="Avatar">
            <div>
                <div class="font-bold text-lg text-slate-900 dark:text-white" id="userName">Loading...</div>
                <div class="text-sm font-medium text-slate-500 dark:text-slate-400" id="headerInternTitle">Intern</div>
            </div>
        </div>
        <div class="flex gap-3 items-center">
            
            <!-- THEME TOGGLE DROPDOWN -->
            <div class="relative group">
                <button class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-semibold py-2 px-4 rounded-xl transition-all shadow-sm flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    Theme
                </button>
                <div class="absolute right-0 mt-2 w-32 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 hidden group-hover:block overflow-hidden z-50">
                    <button onclick="setTheme('light')" class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Light Mode</button>
                    <button onclick="setTheme('dark')" class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">Dark Mode</button>
                    <button onclick="setTheme('system')" class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">System Auto</button>
                </div>
            </div>

            <label id="logoUploadLabel" class="cursor-pointer bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-semibold py-2 px-4 rounded-xl transition-all shadow-sm">
                <span>Upload Logo</span>
                <input type="file" id="logoUpload" class="hidden" accept="image/*" onchange="handleLogoUpload(event)">
            </label>
            <a href="/logout" class="bg-white dark:bg-slate-800 hover:bg-red-50 dark:hover:bg-red-900/30 text-slate-500 dark:text-slate-400 hover:text-red-600 dark:hover:text-red-400 border border-slate-200 dark:border-slate-700 text-sm font-semibold py-2 px-4 rounded-xl transition-all shadow-sm">Log out</a>
        </div>
    </header>

    <div class="no-print flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
        <div class="flex gap-3 w-full md:w-auto">
            <button onclick="toggleModal('singleLogModal')" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md">
                Add Daily Log
            </button>
            <button onclick="toggleModal('weeklyLogModal')" class="flex-1 md:flex-none bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md">
                Batch Weekly Entry
            </button>
        </div>
        
        <button onclick="toggleModal('printSettingsModal')" class="w-full md:w-auto bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 dark:hover:bg-slate-600 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md">
            Export / Print Document
        </button>
    </div>

    <div id="dashboard-views" class="no-print grid gap-8"></div>

    <!-- PRINT TEMPLATE -->
    <div class="print-only official-doc">
        <div class="doc-header">
            <img id="printLogo" class="doc-logo" style="display: none;" src="" alt="Company Logo">
            <div class="doc-titles">
                <div class="doc-company" id="printCompanyDisplay">COMPANY NAME</div>
                <div class="doc-sub">Official Daily Time Record</div>
            </div>
        </div>
        <div id="print-data-container"></div>
        <div class="signatures">
            <div class="sig-block">
                <div class="sig-line" id="printInternName">Intern Name</div>
                <div class="sig-title" id="printInternTitle">Intern Position</div>
            </div>
            <div class="sig-block">
                <div class="sig-line" id="printSupNameDisplay">Supervisor Name</div>
                <div class="sig-title" id="printSupTitleDisplay">Supervisor Title</div>
            </div>
        </div>
    </div>
</div>

<!-- === MODALS === -->

<!-- Onboarding Profile Modal -->
<div id="onboardingModal" class="modal" style="background: rgba(15, 23, 42, 0.9);">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-8 w-full max-w-md m-4">
        <h3 class="text-2xl font-black text-slate-900 dark:text-white mb-2">Welcome to DTR</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Let's set up your profile for your official documents. You can always edit these later in the Print Settings.</p>
        
        <div class="space-y-4 mb-6">
            <div>
                <label class="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wide block mb-1">Your Full Name</label>
                <input type="text" id="onboardName" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:ring-2 focus:ring-blue-600 outline-none">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wide block mb-1">Your Position / Title</label>
                <input type="text" id="onboardTitle" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:ring-2 focus:ring-blue-600 outline-none" placeholder="e.g., IT Administration Intern">
            </div>
        </div>
        <button onclick="saveOnboarding()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg">Save Profile</button>
    </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
